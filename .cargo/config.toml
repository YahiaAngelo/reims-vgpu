[alias]
xtask = "run --package xtask --"

[env]
# jemalloc's build (tikv-jemalloc-sys, reims-vgpu-c's allocator on arm64 macOS) with no malloc
# zone. Its configure reads `enable_zone_allocator` from the environment as it reads
# `--disable-zone-allocator`, which the crate's build script does not pass. With the zone, the
# archive `cargo xtask dist` links whole (`ld -r -force_load`) registers jemalloc as the first
# malloc zone of every host that links it, ahead of the system's.
enable_zone_allocator = "no"

# rustc's parallel front end on every compile, with as many threads as the host has cores
# (`-Zthreads=0`), through Cargo's profile rustflags, which add to `RUSTFLAGS` rather than give way
# to it. `test`, `debugging` and `checked` inherit it from `dev` and `release`. The toolchain is
# nightly for this (rust-toolchain.toml).
[unstable]
profile-rustflags = true

[profile.dev]
rustflags = ["-Zthreads=0"]

[profile.release]
rustflags = ["-Zthreads=0"]

# Linux's baseline aarch64 target is ARMv8.0; the guest-memory atomics (`ldapr`, `ldsetal`) need
# FEAT_RCPC and FEAT_LSE, which every host that runs this has (Apple silicon), as macOS's
# target has them by default.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+lse,+rcpc"]
